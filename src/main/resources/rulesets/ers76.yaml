# ERS76: the predecessor to ERS97 (Electoral Reform Society rules; the 1976 2nd edition of
# "How to Conduct an Election by the Single Transferable Vote", vs. ERS97's 1997 3rd edition),
# also a last-parcel-only method. I could not find the 1976 rulebook itself, or any real
# election run under it with published preference data -- only a secondary source: OpenTally
# (https://yingtongli.me/opentally/docs/options.html), which documents one concrete rule
# delta from ERS97: "the quota is always calculated to 2 decimal places. For full ERS76
# (ERS73) compliance, set Round quota to 0 d.p. when the quota is more than 100." That's NOT
# implemented here -- this preset still rounds the quota to 2dp unconditionally, same as
# ERS97 -- since it comes from a third-party reimplementation's docs, not the rulebook itself,
# and no fixture-grade real/model election exists to verify it against either way. Treat this
# as "believed similar to ERS97, with one documented but unverified/unimplemented difference"
# rather than a verified-accurate reproduction of ERS76 specifically. ERS76 shares ERS97's
# rule 5.2.5 batch-exclusion provision (excluding several of the lowest candidates together
# in one stage when safe), so that's enabled here too. Tied rankings are truncated as under
# ERS97 (see ers97.yaml) -- inherited from ERS97 along with every other setting here, not
# verified against the 1976 rulebook itself.
quota: droop-rounded:2
transfer: last-parcel
rounding: truncate:2
tiebreak: previous-round,declared
batchExclusion: true
tiedRankings: truncate
