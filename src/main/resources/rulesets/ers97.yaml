# Electoral Reform Society 1997 STV rules (as used for many UK organisations' internal
# elections). Quota is Droop rounded UP to 2 decimal places (not the usual floor+1 to a
# whole number); transfer is last-parcel-only (only the most recently arrived batch of
# ballots is examined for a surplus, not everything the candidate holds); transfer values
# truncated to 2 decimal places. The statutory tie-break falls back to a random "lot" as a
# last resort; we approximate that with a fixed declared candidate order instead. Rule 5.2.5
# also allows excluding several of the lowest candidates together in one stage, rather than
# one at a time, whenever that's still safe -- confirmed against the rulebook's own model
# election (via an independent implementation, OpenSTV) that omitting this changes the
# winner. Tied rankings are truncated: a first preference is "the figure '1' standing alone
# against only one candidate" (glossary 6.8), so a "1" against two candidates is no first
# preference and the paper is invalid (6.9); and "there is no next available preference where
# the next sequential preference for a continuing candidate is uncertain" (6.10), so a later
# tie makes the paper non-transferable from that point (6.12).
quota: droop-rounded:2
transfer: last-parcel
rounding: truncate:2
tiebreak: previous-round,declared
batchExclusion: true
tiedRankings: truncate
