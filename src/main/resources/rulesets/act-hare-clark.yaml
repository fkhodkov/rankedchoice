# The Hare-Clark system used for ACT Legislative Assembly elections, per Schedule 4 of the
# Electoral Act 1992 (ACT) as reproduced in Elections ACT's own "Scrutineers information
# handbook": quota is the standard Droop quota, disregarding any fraction (clause 1B); a
# successful candidate's surplus is transferred using only the ballot papers counted for them
# "at the count at which the candidate became successful" (clause 1C) -- i.e. last-parcel-only,
# not every ballot they hold -- while an excluded candidate's ballots each keep the transfer
# value they arrived with.
#
# Transfer value (clause 1C(2)) is surplus / CP, where CP is the number of that parcel's
# ballot papers that specify a next available preference -- excluding papers with no further
# preference from the denominator entirely, unlike Scottish WIGM. That ratio itself is kept
# exact; the "rounded down to 6 decimal places" requirement (clause 1A(2)) applies to each
# destination candidate's own resulting gain (ballot papers received x transfer value), not
# to the shared ratio -- confirmed against real 2020 Kurrajong election data, where rounding
# the ratio first (as Tasmania's Hare-Clark count does -- see hare-clark-qpq.yaml, which
# rounds to 2 decimal places, not 6, despite the shared "Hare-Clark" name) does not reproduce
# the official per-candidate figures, but rounding the per-destination product does, exactly.
# See LastParcelDeferredRoundingTransfer's javadoc for the mechanics.
#
# Tie-break isn't spelled out in the source used here, so this falls back to the same
# previous-round/declared-order chain as our other presets rather than guessing at
# ACT-specific procedure.
quota: droop
transfer: last-parcel-deferred-rounding
rounding: truncate:6
tiebreak: previous-round,declared
