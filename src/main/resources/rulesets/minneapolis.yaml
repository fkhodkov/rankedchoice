# Minneapolis's multi-seat contests (Park and Recreation Board at large, Board of Estimate and
# Taxation), per Code of Ordinances 167.70 as enacted in 2006 and as the City's 2017-2025 counts
# show them. Threshold: the votes counted in the first round, divided by one more than the
# seats, plus one, disregarding fractions (Droop). Each round, before any surplus moves, every
# candidate it's mathematically impossible to elect is defeated together (167.70(a)(1)d): the
# lowest candidates whose votes, with every surplus still to move, are less than the next
# candidate's, and -- inferred from the 2017 and 2025 counts, as the 2006 text doesn't cover it --
# anyone ranked on too few ballots still in play to reach the candidate holding the last of the
# seats left, each test blind to the other's defeats. Otherwise the largest surplus moves (e),
# one a round; its candidate keeps receiving ballots until it does. The surplus fraction is truncated to 4 decimal places and each ballot's
# new value is its value times that, truncated again, as the counts show. With no surplus, the
# candidate with the fewest votes is defeated (f).
#
# Ballots: an overvote or a skipped ranking is passed over, which reproduces the City's first
# rounds. Ties are decided by lot (e, f); the declared order stands in for it.
#
# Checked against the City's summary statements for the Park Board at large and Board of Estimate
# and Taxation contests of 2017, 2021 and 2025, from its cast vote records
# (tools/reference/minneapolis). The rules beyond the 2006 text are inferred from those counts.
quota: droop
transfer: fractional-truncated
rounding: truncate:4
tiebreak: declared
tiedRankings: skip
mathematicalElimination: true
